  <div id="root" data-composition-id="10-code" data-duration="8.1" data-width="1920" data-height="1080">

      <h2 id="f10-code-headline"><span class="f10-code-word">Ask</span> <span class="f10-code-word">before</span><br><span class="f10-code-word">you</span> <span class="f10-code-word">animate.</span></h2>

      <div id="f10-code-term">
        <div id="f10-code-term-bg"></div>

      <div id="f10-code-panel">

        <div id="f10-code-body-a" class="f10-code-body"><div class="f10-code-line"></div><div class="f10-code-line"></div><div class="f10-code-line"></div><div class="f10-code-line"></div><span id="f10-code-caret-a" class="f10-code-caret"></span></div>
        <div id="f10-code-hairline"></div>
        <div id="f10-code-tab-b" class="f10-code-tab">Hero.jsx</div>
        <div id="f10-code-body-b" class="f10-code-body"><div class="f10-code-line"></div><div class="f10-code-line"></div><div class="f10-code-line"></div><span id="f10-code-caret-b" class="f10-code-caret"></span></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DURATION = 7.5;
      var BLINK_CYCLES = 9; /* whole number: period 0.833s over 7.5s */
      var TYPING_GRACE = 0.2;
      var LINE_H = 43.2;
      var CARET_TOP = 6.6;
      var C = { kw: "#C4B1FF", str: "#86E3B9", fn: "#F7CD63", p: "#E8EBF2" };

      function el(id) { return document.getElementById("f10-code-" + id); }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Builds per-character spans for one typed line. Characters reveal at
         times spread over [start, end], with longer gaps on spaces (word breaks)
         and shorter ones on punctuation. Deterministic, index-derived. */
      function buildRow(host, tokens, start, end, row, colOffset, out) {
        var chars = [];
        for (var k = 0; k < tokens.length; k++) {
          var text = tokens[k][0];
          var color = C[tokens[k][1]];
          for (var j = 0; j < text.length; j++) {
            var span = document.createElement("span");
            span.textContent = text.charAt(j);
            span.style.color = color;
            span.style.visibility = "hidden";
            host.appendChild(span);
            chars.push({ el: span, ch: text.charAt(j), color: color });
          }
        }
        var cum = [];
        var acc = 0;
        for (var i = 0; i < chars.length; i++) {
          cum.push(acc);
          var c = chars[i].ch;
          acc += c === " " ? 1.7 : (/[A-Za-z0-9]/.test(c) ? 1 : 0.85);
        }
        var last = cum[cum.length - 1] || 1;
        for (var n = 0; n < chars.length; n++) {
          chars[n].t = start + (end - start) * (cum[n] / last);
          chars[n].row = row;
          chars[n].col = colOffset + n;
          out.push(chars[n]);
        }
      }

      /* Terminal field */
      var term = { caret: el("term-caret"), chars: [], from: 0.32, until: 1.6, top: function () { return 21; }, startRow: 0, startCol: 2 };
      buildRow(el("term-text"), [["npm i framebudget", "p"]], 0.78, 1.42, 0, 2, term.chars);

      /* Code panel, tab app.js */
      var linesA = el("body-a").querySelectorAll('.f10-code-line');
      var codeA = { caret: el("caret-a"), chars: [], from: 1.6, until: 4.7, top: function (r) { return r * LINE_H + CARET_TOP; }, startRow: 0, startCol: 0 };
      buildRow(linesA[0], [["import", "kw"], [" { budget } ", "p"], ["from", "kw"], [" ", "p"], ["\"framebudget\"", "str"], [";", "p"]], 1.72, 2.46, 0, 0, codeA.chars);
      buildRow(linesA[2], [["if", "kw"], [" (budget.", "p"], ["allows", "fn"], ["(", "p"], ["\"parallax\"", "str"], [")) ", "p"], ["startParallax", "fn"], ["();", "p"]], 2.62, 3.62, 2, 0, codeA.chars);
      buildRow(linesA[3], [["budget.", "p"], ["on", "fn"], ["(", "p"], ["\"change\"", "str"], [", update);", "p"]], 3.78, 4.36, 3, 0, codeA.chars);

      /* Code panel, tab Hero.jsx */
      var linesB = el("body-b").querySelectorAll('.f10-code-line');
      var codeB = { caret: el("caret-b"), chars: [], from: 4.7, until: Infinity, top: function (r) { return r * LINE_H + CARET_TOP; }, startRow: 0, startCol: 0 };
      buildRow(linesB[0], [["import", "kw"], [" { ", "p"], ["useBudget", "fn"], [" } ", "p"], ["from", "kw"], [" ", "p"], ["\"framebudget/react\"", "str"], [";", "p"]], 4.78, 5.36, 0, 0, codeB.chars);
      buildRow(linesB[2], [["const", "kw"], [" animate = ", "p"], ["useBudget", "fn"], ["(", "p"], ["\"pageTransition\"", "str"], [");", "p"]], 5.46, 6.0, 2, 0, codeB.chars);

      var fields = [term, codeA, codeB];

      /* Pure function of time: reveals characters, parks the active caret after
         the last typed character, colors it by the token just typed, and blinks
         it only when idle. Seek-safe in both directions. */
      function render(time) {
        var blinkOn = Math.sin(2 * Math.PI * BLINK_CYCLES * (time / DURATION) + Math.PI / 2) > 0;
        for (var f = 0; f < fields.length; f++) {
          var fd = fields[f];
          var lastIdx = -1;
          for (var i = 0; i < fd.chars.length; i++) {
            var shown = time >= fd.chars[i].t;
            fd.chars[i].el.style.visibility = shown ? "visible" : "hidden";
            if (shown) lastIdx = i;
          }
          var active = time >= fd.from && time < fd.until;
          if (!active) {
            fd.caret.style.opacity = "0";
            continue;
          }
          var row = fd.startRow;
          var col = fd.startCol;
          var color = C.p;
          var typing = false;
          if (lastIdx >= 0) {
            var lc = fd.chars[lastIdx];
            row = lc.row;
            col = lc.col + 1;
            color = lc.color;
            typing = time - lc.t < TYPING_GRACE;
          }
          fd.caret.style.left = col + "ch";
          fd.caret.style.top = fd.top(row) + "px";
          fd.caret.style.background = color;
          fd.caret.style.opacity = typing || blinkOn ? "1" : "0";
        }
      }

      render(0);
      var driver = { t: 0 };
      tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: function () { render(driver.t); } }, 0);

      /* Scene 1 (0.0-1.6): kicker, per-word headline, terminal pill stretches from a $ chip and types */
      tl.fromTo(el("kicker"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(el("headline").querySelectorAll('.f10-code-word'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0.06);
      tl.fromTo(el("term-bg"), { opacity: 0, scaleX: 0.15 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.3);
      tl.fromTo(el("term-prompt"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.32);

      /* The code panel (focal) arrives early and empty; it types from Scene 2 (1.6s) */
      tl.fromTo(el("panel"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.32);

      /* Scene 3 (4.6-7.5): hairline draws, Hero.jsx tab appears, app.js tab steps back */
      tl.fromTo(el("hairline"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 4.6);
      tl.fromTo(el("tab-b"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 4.62);
      tl.fromTo(el("tab-a"), { color: "#E8EBF2" }, { color: "#9AA3BC", duration: 0.4, ease: "power3.out" }, 4.6);

      window.__timelines["10-code"] = tl;
    })();
  </script>
