  <script>
    (function () {
      var FID = "01-stutter";
      var $ = function (name) { return document.getElementById("f" + FID + "-" + name); };
      var FPS = 30;
      var tl = gsap.timeline({ paused: true });

      /* ---------- phone: the animated site ---------- */
      var phone = $("phone");
      var orbitOuter = $("orbit-outer");
      var orbitInner = $("orbit-inner");
      var hills = [
        { el: $("hill-back"), speed: 28 },
        { el: $("hill-mid"), speed: 64 },
        { el: $("hill-front"), speed: 132 }
      ];

      // Stutter: from frame 66 (2.2 s) the site only advances on step frames.
      // Each step holds 2 to 5 video frames, taken from HOLDS by step index,
      // then jumps to the current time (a dropped-frame catch-up).
      var STUTTER_FROM = 66;
      var HOLDS = [2, 4, 3, 5, 2, 3, 5, 4, 2, 5, 3, 4];
      var STEPS = [];
      for (var s = STUTTER_FROM, k = 0; s <= 7 * FPS; k++) {
        STEPS.push(s);
        s += HOLDS[k % HOLDS.length];
      }
      function siteTime(t) {
        var f = Math.round(t * FPS);
        if (f < STUTTER_FROM) return t;
        var held = STEPS[0];
        for (var i = 0; i < STEPS.length && STEPS[i] <= f; i++) held = STEPS[i];
        return held / FPS;
      }
      function renderSite(t) {
        var st = siteTime(t);
        orbitOuter.style.transform = "rotate(" + (st * 110).toFixed(2) + "deg)";
        orbitInner.style.transform = "rotate(" + (-st * 170).toFixed(2) + "deg)";
        for (var i = 0; i < hills.length; i++) {
          hills[i].el.style.transform = "translate3d(" + (-st * hills[i].speed).toFixed(2) + "px,0,0)";
        }
      }
      var clock = { t: 0 };
      renderSite(0);
      tl.fromTo(clock, { t: 0 }, { t: 7, duration: 7, ease: "none", onUpdate: function () { renderSite(clock.t); } }, 0);

      // phone is the hero: on screen from the first frames
      tl.fromTo(phone, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0);

      /* ---------- headline: content-sequenced per-word reveal ---------- */
      var SEC_PER_CHAR = 0.012;
      var WORD_BASE = 0.07;
      var CONTENT = [
        { words: $("line1").getElementsByTagName("span"), start: 0.2 },
        { words: $("line2").getElementsByTagName("span"), start: 2.2 }
      ];
      CONTENT.forEach(function (entry) {
        var at = entry.start;
        Array.prototype.forEach.call(entry.words, function (w) {
          tl.fromTo(w, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
          at += WORD_BASE + w.textContent.length * SEC_PER_CHAR;

      });

      tl.fromTo($("line1"), { color: "#E8EBF2" }, { color: "#9AA3BC", duration: 0.6, ease: "power3.out" }, 2.3);

      tl.fromTo($("kicker"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.55);
      tl.fromTo($("track"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.65);
      tl.fromTo($("vsync"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 2.8);
      tl.fromTo($("vsync-label"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.05);
      // one bar per beat (0.1s) streams in from the right edge
      tl.fromTo($("bars"), { x: 698 }, { x: -204, duration: 4.1, ease: "none" }, 2.9);

      /* ---------- readout: 60 fps counts down to 24 fps ---------- */
      var num = $("readout-num");
      var fps = { v: 60 };
      var shown = 60;
      tl.fromTo($("readout"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.5);
      tl.fromTo($("readout-label"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 4.8);
      tl.fromTo(fps, { v: 60 }, {
        v: 24, duration: 1.5, ease: "power3.out", immediateRender: false,
        onUpdate: function () {
          var r = Math.round(fps.v);
          if (r !== shown) { num.textContent = String(r); shown = r; }
        }
      }, 4.7);
      tl.fromTo($("readout-value"), { scale: 1.15 }, { scale: 1, duration: 1.5, ease: "power3.out" }, 4.7);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
