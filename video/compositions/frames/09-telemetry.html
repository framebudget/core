    (function () {
      var DURATION = 4.5;

      var q = function (sel) { return root.querySelectorAll(sel); };
      var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0 to 1.2s): headline per word, switch in its off state, empty card shell */

        { opacity: 0, y: 24 },

      tl.fromTo(byId("f09-telemetry-switch"),
        { opacity: 0, x: 32 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.35);

      tl.fromTo(byId("f09-telemetry-card"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);

      var rows = q(".f09-telemetry-row");

      /* Scene 2 (1.2 to 3.0s): knob slides on, label swaps, payload rows assemble */
      tl.fromTo(byId("f09-telemetry-knob"),
        { x: 0, backgroundColor: "#9AA3BC" },
        { x: 52, backgroundColor: "#E8EBF2", duration: 0.45, ease: "power3.out" }, 1.2);
      tl.fromTo(byId("f09-telemetry-track"),
        { backgroundColor: "#1F2440" },
        { backgroundColor: "#5F6896", duration: 0.45, ease: "power3.out" }, 1.2);

      // discrete-text-sequence: backspace "off" to the fork, type "on,", bulk paste the rest
      var SEQUENCE = [
        { t: 0.0, text: "off" },
        { t: 1.30, text: "of" },
        { t: 1.38, text: "o" },
        { t: 1.50, text: "on" },
        { t: 1.62, text: "on," },
        { t: 1.82, text: "on, by the site developer" }
      ];
      var ON_AT = 1.50;
      var CURSOR_FROM = 1.26;
      var CURSOR_TO = 2.40;
      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return SEQUENCE[0].text;
      }
      var valueEl = byId("f09-telemetry-switch-value");
      var cursorEl = byId("f09-telemetry-cursor");
      var lastText = "off";
      var lastOn = false;
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          var now = driver.t;
          var text = textAt(now);
          if (text !== lastText) {
            valueEl.textContent = text;
            lastText = text;
          }
          var on = now >= ON_AT;
          if (on !== lastOn) {
            valueEl.style.color = on ? "#E8EBF2" : "#9AA3BC";
            lastOn = on;
          }
          // deterministic square-wave blink, one cycle per 0.6s, only while the label is edited
          var visible = now >= CURSOR_FROM && now < CURSOR_TO &&
            Math.sin(((now - CURSOR_FROM) / 0.6) * Math.PI * 2 + Math.PI / 2) > 0;
          cursorEl.style.opacity = visible ? "1" : "0";
        }
      }, 0);

      // payload rows, one per beat
      var ROW_STARTS = [1.65, 1.85, 2.05, 2.25, 2.45, 2.65];
      for (var r = 0; r < rows.length; r++) {
        tl.fromTo(rows[r],

          { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, ROW_STARTS[r]);
      }
      tl.fromTo(rows[3].querySelectorAll(".f09-telemetry-swatch"),
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, ROW_STARTS[3] + 0.1);
      // stat-bars-and-fills: growth bars from the baseline
      tl.fromTo(rows[4].querySelectorAll(".f09-telemetry-bar"),

      // the identifiers row is struck through as it lands

      tl.fromTo(q(".f09-telemetry-badge"),
