    <h2 id="f03-intro-tagline"><span class="f03-intro-word">Keep</span> <span class="f03-intro-word">the</span> <span class="f03-intro-word">effects.</span> <span class="f03-intro-word">Lose</span> <span class="f03-intro-word">the</span> <span class="f03-intro-word">stutter.</span></h2>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="03-intro"]');
        var q = function (id) { return root.querySelector('[id="' + id + '"]'); };

        var mark = q("f03-intro-mark");
        var amber = q("f03-intro-bar-amber");
        var violet = q("f03-intro-bar-violet");
        var mint = q("f03-intro-bar-mint");
        var vsync = q("f03-intro-bar-vsync");
        var wordclip = q("f03-intro-wordclip");
        var wordmark = q("f03-intro-wordmark");
        var words = Array.prototype.slice.call(root.querySelectorAll('.f03-intro-word'));

        // Geometry (px). Lockup scale: 4px per mark unit. Scene 1 scale: bars (26 units) = 220px.
        var LOCKUP_LEFT = 487.86;
        var LOCKUP_TOP = 354;
        var UNIT_LOCKUP = 4;
        var K = 220 / (26 * UNIT_LOCKUP);
        var UNIT_BIG = UNIT_LOCKUP * K;
        // Visual center of the bars in mark units: x 4..27.5, y 3..29.
        var MARK_CX = 15.75;
        var MARK_CY = 16;
        var STAGE_CX = 960;
        var STAGE_CY = LOCKUP_TOP + MARK_CY * UNIT_LOCKUP;
        var START_X = STAGE_CX - LOCKUP_LEFT - MARK_CX * UNIT_BIG;
        var START_Y = STAGE_CY - LOCKUP_TOP - MARK_CY * UNIT_BIG;

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.5s): the mark builds itself, centered and large.
        // The mark's centered start state is rendered at t=0 by the Scene 2 fromTo below.

        // The vsync line grows from its center.
        tl.fromTo(vsync,
          { scaleY: 0.001, transformOrigin: "50% 50%" },
          { scaleY: 1, transformOrigin: "50% 50%", duration: 0.6, ease: "power3.out" },
          0.05);

        // Amber, violet, mint step down toward the line, each sliding in from the left (mark units).
        var bars = [amber, violet, mint];
        var BAR_STARTS = [0.45, 0.68, 0.91];
        for (var i = 0; i < bars.length; i++) {
          tl.fromTo(bars[i],
            { x: -5, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            BAR_STARTS[i]);
        }

        // Scene 2 (1.5-2.5s): mark eases left into the lockup as the wordmark wipes in.
        tl.fromTo(mark,
          { x: START_X, y: START_Y, scale: 1, transformOrigin: "0px 0px" },
          { x: 0, y: 0, scale: 1 / K, transformOrigin: "0px 0px", duration: 0.85, ease: "power3.inOut" },
          1.5);

        tl.fromTo(wordclip,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.out" },
          1.72);
        tl.fromTo(wordmark,
          { x: -32 },
          { x: 0, duration: 0.7, ease: "power3.out" },
          1.72);

        // Scene 3 (2.5-4.0s): tagline per word. Start times derived from word length
        // (dynamic-content-sequencing), with a short hold after each sentence.
        var BASE = 0.04;
        var SEC_PER_CHAR = 0.012;
        var SENTENCE_HOLD = 0.12;
        var TAGLINE_START = 2.5;
        var cumulative = 0;
        var schedule = words.map(function (el) {
          var text = el.textContent;
          var start = cumulative;
          cumulative += BASE + text.length * SEC_PER_CHAR + (text.charAt(text.length - 1) === "." ? SENTENCE_HOLD : 0);
          return { el: el, start: TAGLINE_START + start };
        });
        schedule.forEach(function (entry) {
          tl.fromTo(entry.el,
            { y: 24, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
            entry.start);
        });

        // Hold still to the end of the frame.
        tl.set({}, {}, 4);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-intro"] = tl;
      })();
