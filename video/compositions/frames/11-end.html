    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var q = function (id) { return document.querySelector('[id="' + id + '"]'); };
        var lockup = q("f11-end-lockup");
        var tagline = q("f11-end-tagline");
        var pill = q("f11-end-pill");
        var stage = q("f11-end-stage");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.2s): lockup rises a few pixels and fades in.
        tl.fromTo(lockup, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0);

        // Scene 2 (1.2-2.4s): tagline slides up and fades in, then the install pill fades in.

        tl.fromTo(pill, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.8);

        // Scene 3 (2.4-5.0s): still hold, then the only exit of the film: fade to the ground.
        tl.fromTo(stage, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 4.5);

        window.__timelines["11-end"] = tl;
      })();
