  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    const FID = "06-thresholds";
    const byId = (name) => document.getElementById("f" + FID + "-" + name);
    const ON_CLASS = "f" + FID + "-is-on";

    // Real library defaults. Score scale 0 to 150 over a 560px track.
    const PX_PER_UNIT = 560 / 150;
    const EFFECTS = [
      { id: "sound", th: 50 },
      { id: "pageTransition", th: 55 },
      { id: "parallax", th: 70 },
      { id: "blur", th: 90 },
      { id: "canvasHiRes", th: 120 },
    ];
    const BAND = 0.1;

    // Score path: sweep 0 to 87, settle, dip to 83 (inside blur band 81 to 99), return to 87.
    const SCORE = 87;
    const DIP = 83;
    const T_SWEEP = 1.3, D_SWEEP = 1.0;
    const T_DIP = 2.45, D_DIP = 0.3;
    const T_BACK = 2.75, D_BACK = 0.35;
    const TOTAL = 4.5;

    const power3Out = (x) => 1 - Math.pow(1 - x, 3);
    const power2InOut = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

    function scoreAt(t) {
      if (t < T_SWEEP) return 0;
      if (t < T_SWEEP + D_SWEEP) return SCORE * power3Out((t - T_SWEEP) / D_SWEEP);
      if (t < T_DIP) return SCORE;
      if (t < T_DIP + D_DIP) return SCORE - (SCORE - DIP) * power2InOut((t - T_DIP) / D_DIP);
      if (t < T_BACK) return DIP;
      if (t < T_BACK + D_BACK) return DIP + (SCORE - DIP) * power3Out((t - T_BACK) / D_BACK);
      return SCORE;
    }

    // Discrete state sequence: an effect switches on only once the rising score is
    // clearly above its band (threshold x 1.1). Time of crossing inverts the sweep ease.
    const crossTime = (s) => T_SWEEP + D_SWEEP * (1 - Math.cbrt(1 - s / SCORE));
    const SEQUENCE = [{ t: 0, on: [] }];
    let onSoFar = [];
    EFFECTS.forEach((e) => {
      const upper = e.th * (1 + BAND);
      if (upper <= SCORE) {
        onSoFar = onSoFar.concat(e.id);
        SEQUENCE.push({ t: crossTime(upper), on: onSoFar.slice() });
      }
    });
    function stateAt(t) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (t >= SEQUENCE[i].t) return SEQUENCE[i];
      }
      return SEQUENCE[0];
    }

    const rowEls = {};
    EFFECTS.forEach((e) => { rowEls[e.id] = byId("row-" + e.id); });
    const lineEl = byId("line");
    const scoreEl = byId("score");

    let lastKey = null;
    let lastScore = null;
    function render(t) {
      const s = scoreAt(t);
      const shift = "translateX(" + (s * PX_PER_UNIT).toFixed(2) + "px)";
      lineEl.style.transform = shift;
      scoreEl.style.transform = shift;
      const rounded = Math.round(s);
      if (rounded !== lastScore) {
        scoreEl.textContent = "score " + rounded;
        lastScore = rounded;
      }
      const state = stateAt(t);
      const key = state.on.join(",");
      if (key !== lastKey) {
        EFFECTS.forEach((e) => {
          rowEls[e.id].classList.toggle(ON_CLASS, state.on.indexOf(e.id) !== -1);
        });
        lastKey = key;
      }
    }

    const driver = { t: 0 };
    tl.to(driver, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => render(driver.t) }, 0);
    render(0);

    // Scene 1 (0.0 to 1.3): headline words, then five rows top to bottom.
    const words = Array.prototype.slice.call(byId("headline").children);
    tl.fromTo(words, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0);

    EFFECTS.forEach((e, i) => {
      const at = 0.3 + i * 0.12;
      tl.fromTo(byId("chip-" + e.id), { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at);
      tl.fromTo(byId("track-" + e.id), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, at + 0.05);
      tl.fromTo(byId("band-" + e.id), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, at + 0.3);
      tl.fromTo(byId("tick-" + e.id), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, at + 0.35);
      tl.fromTo(byId("num-" + e.id), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at + 0.35);
    });
    tl.fromTo([byId("axis-min"), byId("axis-max")], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 1.0);

    // Scene 2 (1.3 to 3.0): score line sweeps in, rows flip, blur holds inside its band.
    tl.fromTo([lineEl, scoreEl], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power3.out" }, T_SWEEP);
    tl.fromTo(byId("strike-blur"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.3);
    tl.fromTo(byId("strike-canvasHiRes"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.38);
    tl.fromTo(byId("band-edge-blur"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.out" }, T_DIP);
    tl.fromTo(byId("band-note"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.5);

    // Scene 3 (3.0 to 4.5): supporting line, tier shortcuts, reduced-motion note, hold.
    tl.fromTo(byId("lead"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.0);
    tl.fromTo(byId("tier-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.2);
    tl.fromTo(
      [byId("tier-full"), byId("tier-high"), byId("tier-medium"), byId("tier-lite")],
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 },
      3.3
    );
    tl.fromTo(byId("rm-note"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.75);

    window.__timelines = window.__timelines || {};
    window.__timelines["06-thresholds"] = tl;
  </script>
