  <div id="root" data-composition-id="05-benchmark" data-width="1920" data-height="1080" data-start="0" data-duration="5">

      <div id="f05-benchmark-headline"><span class="f05-benchmark-word">Measures</span> <span class="f05-benchmark-word">what</span> <span class="f05-benchmark-word">the</span> <span class="f05-benchmark-word">device</span> <span class="f05-benchmark-word">can</span> <span class="f05-benchmark-word">really</span> <span class="f05-benchmark-word">do.</span></div>

        <span id="f05-benchmark-lead-a" class="f05-benchmark-sentence">A fixed-time CPU benchmark, cold before paint and warm at load.</span>
        <span id="f05-benchmark-lead-b" class="f05-benchmark-sentence">The warm score is cached for the next page.</span>

      <div class="f05-benchmark-row">
        <div class="f05-benchmark-kname">float math</div>
        <div class="f05-benchmark-track"></div>

      <div class="f05-benchmark-row">
        <div class="f05-benchmark-kname">typed arrays</div>

      <div class="f05-benchmark-row">
        <div class="f05-benchmark-kname">allocation</div>
        <div class="f05-benchmark-track"></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "05-benchmark";
      var DUR = 4.5;
      var CHALK = "#E8EBF2";
      var MIST = "#9AA3BC";
      var byId = function (s) { return document.getElementById("f" + ID + "-" + s); };
      var byClass = function (s) {
        return Array.prototype.slice.call(document.querySelectorAll('[class~="' + "f" + ID + "-" + s + '"]'));
      };

      // Score schedule (seconds on this frame's timeline)
      var COLD = 61, WARM = 87, SCALE_MAX = 125;
      var C0 = 1.4, C1 = 2.25;   // cold count window
      var W0 = 2.4, W1 = 3.05;   // warm count window
      var START_SCALE = 0.5;      // counter grows from half size to full as the value rises
      var COLD_SCALE = START_SCALE + (1 - START_SCALE) * (COLD / WARM);
      var COUNT_EASE = "power3.out";
      var easeFn = gsap.parseEase(COUNT_EASE);

      // Kernel tracks: build the discrete slices (fixed count, deterministic)
      var SLICES = 14;
      var tracks = byClass("track");
      var rowsSegs = tracks.map(function (track) {
        var segs = [];
        for (var i = 0; i < SLICES; i++) {
          var seg = document.createElement("div");
          seg.className = "f" + ID + "-seg";
          track.appendChild(seg);
          segs.push(seg);
        }
        return segs;
      });
      var knames = byClass("kname");

      var numEl = byId("num");
      var phaseEl = byId("phase");

      // Score value as a pure function of timeline time
      function scoreAt(t) {
        if (t < C0) return 0;
        if (t < C1) return COLD * easeFn((t - C0) / (C1 - C0));
        if (t < W0) return COLD;
        if (t < W1) return COLD + (WARM - COLD) * easeFn((t - W0) / (W1 - W0));
        return WARM;
      }
      // Discrete label states, reverse-searched
      var PHASES = [
        { t: 0, text: "cold, before paint" },
        { t: W0, text: "warm, at load" }
      ];
      function phaseAt(t) {
        for (var i = PHASES.length - 1; i >= 0; i--) {
          if (t >= PHASES[i].t) return PHASES[i].text;
        }
        return PHASES[0].text;
      }

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0 to 1.4): headline per word, kernel meters fill in slices
      tl.fromTo(byClass("word"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.07 }, 0);

      tl.fromTo(byId("kernels"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.15);

      var ROW_AT = 0.3, ROW_GAP = 0.2, SLICE_GAP = 0.035;
      rowsSegs.forEach(function (segs, r) {
        var at = ROW_AT + r * ROW_GAP;
        tl.fromTo(knames[r],
          { color: MIST },
          { color: CHALK, duration: 0.25, ease: "power2.out" }, at);
        tl.fromTo(segs,
          { opacity: 0 },
          { opacity: 1, duration: 0.05, ease: "none", stagger: SLICE_GAP }, at);
      });

      // Score panel shell arrives early so the hero number reads by 0.5s, pending at 0
      tl.fromTo(byId("score"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.35);

      // Scene 2 (1.4 to 3.0): count cold, then warm; label swaps discretely
      var drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          numEl.textContent = String(Math.round(scoreAt(drv.t)));
          phaseEl.textContent = phaseAt(drv.t);
        }
      }, 0);

      tl.fromTo(numEl, { color: MIST }, { color: CHALK, duration: 0.3, ease: "power2.out" }, C0);
      tl.fromTo(numEl, { scale: START_SCALE }, { scale: COLD_SCALE, duration: C1 - C0, ease: COUNT_EASE }, C0);
      tl.fromTo(numEl, { scale: COLD_SCALE }, { scale: 1, duration: W1 - W0, ease: COUNT_EASE, immediateRender: false }, W0);

      tl.fromTo(phaseEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, C0 + 0.05);

      // Hairline scale under the number, fill paired with the count (same start + ease)
      tl.fromTo(byId("hair"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, C0);
      tl.fromTo(byId("fill"), { scaleX: 0 }, { scaleX: COLD / SCALE_MAX, duration: C1 - C0, ease: COUNT_EASE }, C0);
      tl.fromTo(byId("fill"), { scaleX: COLD / SCALE_MAX }, { scaleX: WARM / SCALE_MAX, duration: W1 - W0, ease: COUNT_EASE, immediateRender: false }, W0);
      tl.fromTo(byId("tick"), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.7);
      tl.fromTo(byId("ticklabel"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.8);
      tl.fromTo(byId("example"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.95);

      // Readouts record each reading as it lands; cold steps back once warm starts
      tl.fromTo(byId("cold"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, C1);
      tl.fromTo(byId("cold"), { color: CHALK }, { color: MIST, duration: 0.3, ease: "power2.out", immediateRender: false }, W0);
      tl.fromTo(byId("warm"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, W1);

      // Scene 3 (3.0 to 4.5): supporting line, cached chip, then hold
      tl.fromTo(byId("lead-a"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.0);
      tl.fromTo(byId("lead-b"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.2);
      tl.fromTo(byId("chip"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 3.4);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
