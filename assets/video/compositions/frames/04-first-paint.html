    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME_ID = "04-first-paint";
        var TOTAL = 4.5;
        var root = document.querySelector('[data-composition-id="04-first-paint"]') || document;
        function byId(id) { return root.querySelector('[id="' + "f" + FRAME_ID + "-" + id + '"]'); }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;

        // Scene 1 (0.0 to 1.2s): headline per-word reveal
        var words = root.querySelectorAll('.f04-first-paint-word');
        tl.fromTo(words, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0);

        // Scene 1: timeline hairline draws left to right (svg-path-draw, constant-speed pen)
        var LINE_X0 = 40, LINE_X1 = 800;
        var DRAW_START = 0.2, DRAW_DUR = 0.9;
        var rail = byId("rail-line");
        var railLen = rail.getTotalLength ? rail.getTotalLength() : (LINE_X1 - LINE_X0);
        rail.style.strokeDasharray = String(railLen);
        rail.style.strokeDashoffset = String(railLen);
        tl.fromTo(rail, { strokeDashoffset: railLen }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "none" }, DRAW_START);

        // Each tick label reveals the moment the pen passes its x
        var ticks = root.querySelectorAll('.f04-first-paint-tick');
        for (var i = 0; i < ticks.length; i++) {
          var x = parseFloat(ticks[i].getAttribute("data-x"));
          var tPass = DRAW_START + ((x - LINE_X0) / (LINE_X1 - LINE_X0)) * DRAW_DUR;
          tl.fromTo(ticks[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, tPass);
        }

        // Scene 2 (1.2 to 3.0s): tiny boot block lands on the line
        tl.fromTo(byId("boot"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.2);

        // Playhead travels html -> boot script, holds for the decision, then -> first paint.
        // The progress fill (stat-bars-and-fills, scaleX from left) shares timing and ease.
        var BOOT_X = 230, PAINT_X = 560, SPAN = LINE_X1 - LINE_X0;
        var playhead = byId("playhead");
        var fill = byId("fill");
        tl.fromTo(playhead, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.3);
        tl.fromTo(playhead, { x: 0 }, { x: BOOT_X - LINE_X0, duration: 0.5, ease: "power2.inOut" }, 1.3);
        tl.fromTo(fill, { scaleX: 0 }, { scaleX: (BOOT_X - LINE_X0) / SPAN, duration: 0.5, ease: "power2.inOut" }, 1.3);

        // Chips stack above the block (bottom chip first), connector grows up from the block
        tl.fromTo(byId("connector"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, 1.78);
        var chipEls = [byId("chip-canvas"), byId("chip-transition"), byId("chip-parallax")];
        tl.fromTo(chipEls, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.08 }, 1.82);

        // discrete-text-sequence: all three chips resolve on/off at one threshold, instant swap
        var T_RESOLVE = 2.3;
        var SEQUENCE = [
          { t: 0.0, state: "pending" },
          { t: T_RESOLVE, state: "resolved" }
        ];
        function stateAt(time) {
          for (var k = SEQUENCE.length - 1; k >= 0; k--) {
            if (time >= SEQUENCE[k].t) return SEQUENCE[k].state;
          }
          return SEQUENCE[0].state;
        }
        var lastState = "";
        function applyState(state) {
          for (var c = 0; c < chipEls.length; c++) {
            var el = chipEls[c];
            var resolve = el.getAttribute("data-resolve");
            el.classList.remove("f04-first-paint-is-on", "f04-first-paint-is-off");
            if (state === "resolved") {
              el.classList.add(resolve === "on" ? "f04-first-paint-is-on" : "f04-first-paint-is-off");
            }
          }
        }
        var driver = { t: 0 };
        tl.fromTo(driver, { t: 0 }, {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            var s = stateAt(driver.t);
            if (s !== lastState) {
              applyState(s);
              lastState = s;
            }
          }
        }, 0);

        // Playhead resumes to first paint; that tick brightens to Chalk on arrival
        tl.to(playhead, { x: PAINT_X - LINE_X0, duration: 0.5, ease: "power2.inOut" }, 2.35);
        tl.to(fill, { scaleX: (PAINT_X - LINE_X0) / SPAN, duration: 0.5, ease: "power2.inOut" }, 2.35);
        tl.fromTo(byId("paint-mark"), { backgroundColor: "#5F6896" }, { backgroundColor: "#E8EBF2", duration: 0.3, ease: "power1.out" }, 2.8);
        tl.fromTo(byId("paint-label"), { color: "#9AA3BC" }, { color: "#E8EBF2", duration: 0.3, ease: "power1.out" }, 2.8);

        // Scene 3 (3.0 to 4.5s): supporting line under the headline, then hold
        tl.fromTo(byId("lead"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.0);
      })();
