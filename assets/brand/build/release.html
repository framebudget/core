<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>framebudget release art source</title>
<!--
  Render at 1200x630 with scripts/release/render-art.mjs, which fills the
  fb:* slots below. The sample content shows what a release looks like.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--page-glow), var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
  }

  .logo {
    position: absolute;
    top: 64px;
    left: 72px;
    width: 236px;
  }

  .date {
    position: absolute;
    top: 62px;
    right: 72px;
    padding: 8px 14px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-control);
    background: var(--color-surface-sunken);
    font-family: var(--font-mono);
    font-size: 19px;
  }

  .date span {
    color: var(--color-muted);
  }

  .label {
    position: absolute;
    top: 146px;
    left: 76px;
    color: var(--color-accent);
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* The version shrinks to fit left of the counts and stays centered in its band. */
  .version {
    position: absolute;
    top: 178px;
    left: 68px;
    display: flex;
    align-items: center;
    height: 150px;
    margin: 0;
    font-size: min(150px, calc(1150px / var(--chars)));
    font-weight: 780;
    font-stretch: 116%;
    letter-spacing: -0.035em;
    line-height: 1;
    white-space: nowrap;
  }

  .counts {
    position: absolute;
    top: 186px;
    right: 72px;
    display: flex;
    gap: 14px;
  }

  .count {
    width: 132px;
    padding: 14px 18px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    background: var(--color-surface);
    box-shadow: var(--edge-light);
  }

  .count b {
    display: block;
    font-size: 54px;
    font-weight: 760;
    font-stretch: 112%;
    line-height: 1;
  }

  .count span {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--color-muted);
    font-family: var(--font-mono);
    font-size: 15px;
  }

  .count span::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: var(--radius-segment);
    background: var(--c);
  }

  .changes {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 60px;
    height: 196px;
    box-sizing: border-box;
    padding: 14px 28px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    background: var(--color-surface);
    box-shadow: var(--edge-light);
  }

  .change {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 56px;
    border-bottom: 1px solid var(--color-border);
  }

  .change:last-child {
    border-bottom: 0;
  }

  .change .kind {
    flex: none;
    width: 128px;
    padding: 7px 0;
    border-radius: var(--radius-segment);
    background: var(--c);
    color: var(--effect-label);
    font-size: 17px;
    font-weight: 680;
    text-align: center;
  }

  .change .text {
    flex: 1;
    overflow: hidden;
    font-size: 25px;
    font-weight: 560;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .change .areas {
    flex: none;
    color: var(--color-muted);
    font-family: var(--font-mono);
    font-size: 15px;
  }

  .change.empty {
    height: 100%;
    justify-content: center;
  }

  .change.empty .text {
    color: var(--color-muted);
  }

  .breaking { --c: var(--fb-vsync); }
  .features { --c: var(--fb-mint); }
  .fixes { --c: var(--fb-amber); }
  .performance { --c: var(--fb-cyan); }
  .other { --c: var(--fb-pewter); }
  .library { --c: var(--fb-violet); }
  .website { --c: var(--fb-blue); }
</style>
</head>
<body>
  <img class="logo" src="../logo/lockup-dark.svg" alt="framebudget">
  <!-- fb:date --><div class="date"><span>released</span> 2026-10-03</div><!-- /fb:date -->
  <div class="label">New release</div>
  <!-- fb:version --><h1 class="version" style="--chars: 6">v0.2.0</h1><!-- /fb:version -->
  <!-- fb:counts -->
  <div class="counts">
    <div class="count library"><b>3</b><span>Library</span></div>
    <div class="count website"><b>4</b><span>Website</span></div>
  </div>
  <!-- /fb:counts -->
  <!-- fb:changes -->
  <div class="changes">
    <div class="change features"><span class="kind">Feature</span><span class="text">One report per browser a week</span><span class="areas">library, website</span></div>
    <div class="change features"><span class="kind">Feature</span><span class="text">Collect anonymous device reports</span><span class="areas">website</span></div>
    <div class="change other"><span class="kind">Change</span><span class="text">Lib at root, lint rules, cve fixes</span><span class="areas">library</span></div>
  </div>
  <!-- /fb:changes -->
  <script>
    // render-art.mjs reads this attribute to make sure the brand fonts loaded.
    Promise.all([document.fonts.load('780 16px "Archivo"'), document.fonts.load('400 16px "Martian Mono"')])
      .then((loaded) => (loaded.every((faces) => faces.length > 0) ? "loaded" : "missing"), () => "failed")
      .then((status) => (document.documentElement.dataset.fonts = status));
  </script>
</body>
</html>
