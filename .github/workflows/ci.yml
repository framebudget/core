# Gates for pull requests that are ready for review. Draft pull requests skip
# every job; marking one ready for review starts the run.
#
#   library   format, lint, typecheck, tests (vitest and the release scripts), build, size,
#             and pack (checks the three tarballs and smoke-installs them)
#   gate      one required check: fails when the library job failed or was cancelled
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  library:
    name: Library
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: node scripts/pack.mjs --out "$RUNNER_TEMP/pack"

  gate:
    name: CI
    needs: [library]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a gate failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "* | *" skipped "*) exit 1 ;;
          esac
