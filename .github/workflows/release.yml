# Runs when a release tag vX.Y.Z is pushed by hand (in order). Immutable releases
# are on: once published, a release's assets and tag can never change, so every
# asset is built and attached to a draft first, and publishing the draft is the
# last step. GitHub then signs a release attestation over the tag, the commit and
# every asset; each asset also gets a build provenance attestation.
#
#   validate        tag format and order, bump warning, what shipped (changed, changed_<section>)
#   notes           release notes, release art, changelog pull request (release/vX.Y.Z)
#   package         when a package changed: audit, test, set the version, pack the three tarballs once
#   publish-github  @framebudget/core and @framebudget/react to GitHub Packages
#   publish-npm     all three to npmjs with provenance, when the NPM_TOKEN secret is set
#   release         draft with notes, art, tarballs and SHA256SUMS, then publish (immutable)
#
# Sections and paths come from release.config.json; the art template from framebudget/assets.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already has a release; immutable releases cannot be replaced. Push a new tag."
            exit 1
          fi
      - name: Check the tag and classify the commits
        id: check
        run: node scripts/release/notes.mjs --tag "$TAG" --check

  notes:
    name: Release notes and changelog
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # The changelog pull request builds on the default branch; the full history
      # and tags are needed to find the previous release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # The release card template and the brand fonts it loads.
      - uses: actions/checkout@v7
        with:
          repository: framebudget/assets
          path: .brand
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write the changelog and the release notes
        run: |
          art_name="framebudget-$TAG.png"
          date=$(date -u +%F)
          echo "ART_NAME=$art_name" >> "$GITHUB_ENV"
          echo "DATE=$date" >> "$GITHUB_ENV"
          node scripts/release/notes.mjs --tag "$TAG" --date "$date" --out-dir "$RUNNER_TEMP/release" \
            --art-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$art_name"
      - name: Render the release art
        run: |
          node scripts/release/render-art.mjs --template .brand/brand/build/release.html \
            --version "$VERSION" --date "$DATE" --notes "$RUNNER_TEMP/release/notes.json" \
            --out "$RUNNER_TEMP/release/$ART_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            ${{ runner.temp }}/release/release-body.md
            ${{ runner.temp }}/release/${{ env.ART_NAME }}
          if-no-files-found: error
      - name: Set the package versions
        run: node scripts/release/set-version.mjs "$VERSION"
      - name: Open the changelog pull request
        run: |
          branch="release/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add CHANGELOG.md packages/*/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit: $BASE already has the $TAG changelog."
            exit 0
          fi
          body=$(printf -- '- prepend %s to CHANGELOG.md\n- set every package version to %s' "$TAG" "$VERSION")
          git commit --message "chore(release): $TAG" --message "$body"
          git push --force origin "$branch"
          pulls="repos/$GITHUB_REPOSITORY/pulls"
          open_pr=$(gh api "$pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$branch" --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh api --method PATCH "$pulls/$open_pr" -F "body=@$RUNNER_TEMP/release/pr-body.md" --silent
          else
            gh api --method POST "$pulls" -f "title=chore(release): $TAG" -f "head=$branch" -f "base=$BASE" \
              -F "body=@$RUNNER_TEMP/release/pr-body.md" --silent
          fi

  package:
    name: Build the packages
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Registry signatures of every installed dependency, and no known high
      # severity advisory in what the packages ship with.
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Set the package versions
        run: node scripts/release/set-version.mjs "$VERSION"
      # pack.mjs builds every package, packs each tarball once, checks what ships
      # and smoke-installs the three together; its last line lists the tarballs.
      - name: Pack once and check what ships
        run: |
          out="$RUNNER_TEMP/pack"
          node scripts/pack.mjs --out "$out" | tee "$RUNNER_TEMP/pack.log"
          tail -n 1 "$RUNNER_TEMP/pack.log" | OUT="$out" node -e '
            const fs = require("fs");
            const names = JSON.parse(fs.readFileSync(0, "utf8"));
            const packed = fs.readdirSync(process.env.OUT).filter((f) => f.endsWith(".tgz")).sort();
            if (names.length !== 3 || JSON.stringify([...names].sort()) !== JSON.stringify(packed)) {
              console.error("Expected three tarballs; pack.mjs listed [" + names + "], " + process.env.OUT + " holds [" + packed + "]");
              process.exit(1);
            }
            console.log("Packed " + names.join(", "));
          '
      # Build provenance: a signed statement that this workflow run built each
      # tarball from the tagged commit (public repositories only).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/pack/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish-github:
    name: Publish to GitHub Packages
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@framebudget"
      # The exact tarballs attached to the release, so their SHA-256 and the
      # release attestation describe what the registry serves. GitHub Packages
      # only takes scoped names, so the unscoped framebudget goes to npmjs only.
      - name: Publish the scoped packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; else dist_tag=latest; fi
          for name in @framebudget/core @framebudget/react; do
            file=""
            for tarball in *.tgz; do
              if [ "$(tar -xzOf "$tarball" package/package.json | jq -r .name)" = "$name" ]; then file="$tarball"; fi
            done
            if [ -z "$file" ]; then
              echo "::error::No tarball for $name."
              exit 1
            fi
            npm publish "./$file" --registry https://npm.pkg.github.com --tag "$dist_tag"
          done

  publish-npm:
    name: Publish to npmjs
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Dependencies first, so framebudget never points at an unpublished version.
      # A version already on npmjs (a re-run) is skipped; npm versions are permanent.
      - name: Publish the three packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::The NPM_TOKEN secret is not set; skipping npmjs. Publish later with the publish-npm workflow."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; else dist_tag=latest; fi
          for name in @framebudget/core @framebudget/react framebudget; do
            file=""
            for tarball in *.tgz; do
              if [ "$(tar -xzOf "$tarball" package/package.json | jq -r .name)" = "$name" ]; then file="$tarball"; fi
            done
            if [ -z "$file" ]; then
              echo "::error::No tarball for $name."
              exit 1
            fi
            if npm view "$name@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION is already on npmjs."
              continue
            fi
            npm publish "./$file" --registry https://registry.npmjs.org --provenance --access public --tag "$dist_tag"
          done

  release:
    name: Publish the release
    needs: [validate, notes, package, publish-github, publish-npm]
    # The package jobs are skipped when no package changed; every job that ran must have passed.
    if: >-
      always() &&
      needs.validate.result == 'success' && needs.notes.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.package.result) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-github.result) &&
      contains(fromJSON('["success","skipped"]'), needs.publish-npm.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: assets
      - if: needs.package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: package
          path: assets
      - name: Checksums and integrity notes
        run: |
          mv assets/release-body.md body.md
          (cd assets && sha256sum -- * > SHA256SUMS)
          {
            echo
            echo "## Integrity"
            echo
            echo "This release is immutable: its tag and assets cannot change after publishing, and GitHub signs a release attestation over them. Every asset was built by the [release workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from the tagged commit and carries a build provenance attestation; the package tarballs are the exact files published to the registries."
            echo
            echo '```sh'
            echo "gh release verify $TAG --repo $GITHUB_REPOSITORY"
            echo "gh release verify-asset $TAG <file> --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } >> body.md
          cat assets/SHA256SUMS
      # The tarballs got their provenance where they were built; the art and the checksums get theirs here.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/*.png
            assets/SHA256SUMS
      - name: Create the draft with every asset
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file body.md "${flags[@]}"
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      # GitHub signs the release attestation a moment after publishing; wait for
      # it (up to about two minutes) before verifying the release and each asset.
      - name: Verify the release attestation
        run: |
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then break; fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for $TAG after waiting."
              exit 1
            fi
            sleep 10
          done
          for file in assets/*; do
            gh release verify-asset "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
