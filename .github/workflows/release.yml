# Runs when a release tag vX.Y.Z is pushed by hand (in order). Immutable releases
# are on: once published, a release's assets and tag can never change, so every
# asset is built and attached to a draft first, and publishing the draft is the
# last step. GitHub then signs a release attestation over the tag, the commit and
# every asset.
#
#   validate  tag format and order, bump warning, what shipped (library_changed)
#   notes     release notes, release art, changelog pull request (release/vX.Y.Z)
#   package   when the library changed: audit, test, build, pack the tarball once
#   publish   that exact tarball to GitHub Packages as @framebudget/framebudget
#   deploy    the website and the worker to Cloudflare, always
#   release   draft with notes, art, tarball and SHA256SUMS, then publish (immutable)
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      library_changed: ${{ steps.check.outputs.library_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already has a release; immutable releases cannot be replaced. Push a new tag."
            exit 1
          fi
      - name: Check the tag and classify the commits
        id: check
        run: node scripts/release/notes.mjs --tag "$TAG" --check

  notes:
    name: Release notes and changelog
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # The changelog pull request builds on the default branch; the full history
      # and tags are needed to find the previous release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write the changelog and the release notes
        run: |
          art_name="framebudget-$TAG.png"
          date=$(date -u +%F)
          echo "ART_NAME=$art_name" >> "$GITHUB_ENV"
          echo "DATE=$date" >> "$GITHUB_ENV"
          node scripts/release/notes.mjs --tag "$TAG" --date "$date" --out-dir "$RUNNER_TEMP/release" \
            --art-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$art_name"
      - name: Render the release art
        run: |
          node scripts/release/render-art.mjs --version "$VERSION" --date "$DATE" \
            --notes "$RUNNER_TEMP/release/notes.json" --out "docs/public/releases/$TAG.png"
          cp "docs/public/releases/$TAG.png" "$RUNNER_TEMP/release/$ART_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            ${{ runner.temp }}/release/release-body.md
            ${{ runner.temp }}/release/${{ env.ART_NAME }}
          if-no-files-found: error
      - name: Open the changelog pull request
        run: |
          branch="release/$TAG"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add CHANGELOG.md package.json package-lock.json "docs/public/releases/$TAG.png"
          if git diff --cached --quiet; then
            echo "Nothing to commit: $BASE already has the $TAG changelog."
            exit 0
          fi
          body=$(printf -- '- prepend %s to CHANGELOG.md\n- set the package version to %s\n- add the release art at docs/public/releases/%s.png' \
            "$TAG" "$VERSION" "$TAG")
          git commit --message "chore(release): $TAG" --message "$body"
          git push --force origin "$branch"
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/release/pr-body.md"
          else
            gh pr create --base "$BASE" --head "$branch" --title "chore(release): $TAG" \
              --body-file "$RUNNER_TEMP/release/pr-body.md"
          fi

  package:
    name: Build the package
    needs: validate
    if: needs.validate.outputs.library_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Registry signatures of every installed dependency, and no known high
      # severity advisory in what the package ships with.
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      # The package is `framebudget` in the repository; GitHub Packages needs the owner's scope.
      - name: Scope the package for GitHub Packages
        run: |
          npm pkg set name=@framebudget/framebudget version="$VERSION" \
            publishConfig.registry=https://npm.pkg.github.com \
            repository.type=git repository.url="git+https://github.com/$GITHUB_REPOSITORY.git"
      - name: Pack once and check what ships
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package" --json | node -e '
            const [pack] = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const allowed = /^(package\.json|README\.md|LICENSE|dist\/[\w.-]+\.(js|d\.ts))$/;
            const unexpected = pack.files.map((f) => f.path).filter((p) => !allowed.test(p));
            if (unexpected.length) {
              console.error("Unexpected files in the package: " + unexpected.join(", "));
              process.exit(1);
            }
            if (pack.files.some((f) => f.path === "package.json")) {
              const scripts = JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts || {};
              const hooks = ["preinstall", "install", "postinstall", "prepare"].filter((s) => s in scripts);
              // prepare only runs for git installs, never from a registry tarball; install hooks do.
              const installHooks = hooks.filter((s) => s !== "prepare");
              if (installHooks.length) {
                console.error("The package must not run install scripts: " + installHooks.join(", "));
                process.exit(1);
              }
            }
            console.log(pack.filename);
          ')
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      TARBALL: ${{ needs.package.outputs.tarball }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@framebudget"
      # The exact tarball that is attached to the release, so its SHA-256 and
      # the release attestation describe what the registry serves.
      - name: Publish
        run: |
          if [ "$PRERELEASE" = "true" ]; then dist_tag=next; else dist_tag=latest; fi
          npm publish "./$TARBALL" --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix docs
      - run: npm ci --prefix worker
      - run: npm test --prefix worker
      - run: npm run build --prefix docs
      - name: Apply the D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply framebudget --remote
      - name: Deploy the worker and the site
        working-directory: worker
        run: npx wrangler deploy

  release:
    name: Publish the release
    needs: [validate, notes, package, publish, deploy]
    # The package jobs are skipped when the library did not change; every job that ran must have passed.
    if: >-
      always() &&
      needs.validate.result == 'success' && needs.notes.result == 'success' && needs.deploy.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.package.result) &&
      contains(fromJSON('["success","skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: assets
      - if: needs.package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: package
          path: assets
      - name: Checksums and integrity notes
        run: |
          mv assets/release-body.md body.md
          (cd assets && sha256sum -- * > SHA256SUMS)
          {
            echo
            echo "## Integrity"
            echo
            echo "This release is immutable: its tag and assets cannot change after publishing, and GitHub signs a release attestation over them. Every asset was built by the [release workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from the tagged commit; the package tarball is the exact file published to GitHub Packages."
            echo
            echo '```sh'
            echo "gh release verify $TAG --repo $GITHUB_REPOSITORY"
            echo "gh release verify-asset $TAG <file> --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } >> body.md
          cat assets/SHA256SUMS
      - name: Create the draft with every asset
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file body.md "${flags[@]}"
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      # GitHub signs the release attestation a moment after publishing; wait for
      # it (up to about two minutes) before verifying the release and each asset.
      - name: Verify the release attestation
        run: |
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then break; fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for $TAG after waiting."
              exit 1
            fi
            sleep 10
          done
          for file in assets/*; do
            gh release verify-asset "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
