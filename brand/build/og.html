<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>framebudget social preview source</title>
<!-- Render at 1200x630 and screenshot to ../og.png -->
<link rel="stylesheet" href="../tokens.css">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../fonts/archivo-var.woff2") format("woff2");
    font-weight: 400 800;
    font-stretch: 100% 125%;
  }

  @font-face {
    font-family: "Martian Mono";
    src: url("../fonts/martian-mono-var.woff2") format("woff2");
    font-weight: 400 700;
  }

  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--page-glow), var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
  }

  .logo {
    position: absolute;
    top: 64px;
    left: 72px;
    width: 236px;
  }

  .npm {
    position: absolute;
    top: 62px;
    right: 72px;
    padding: 8px 14px;
    border: 1px solid var(--color-border-strong);
    border-radius: 6px;
    background: var(--color-surface-sunken);
    font-family: var(--font-mono);
    font-size: 19px;
  }

  .npm span {
    color: var(--color-muted);
  }

  h1 {
    position: absolute;
    top: 150px;
    left: 72px;
    margin: 0;
    font-size: 74px;
    font-weight: 780;
    font-stretch: 116%;
    letter-spacing: -0.035em;
    line-height: 1;
  }

  .chart {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 60px;
    height: 172px;
    padding: 26px 28px 0;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    background: var(--color-surface);
    box-shadow: var(--edge-light);
  }

  .track {
    position: relative;
    height: 96px;
    border-radius: 2px;
    background:
      repeating-linear-gradient(90deg, var(--color-border) 0 1px, transparent 1px 5%),
      var(--color-surface-sunken);
  }

  .seg {
    position: absolute;
    height: 68px;
    top: 14px;
    border-radius: 2px;
    background: var(--c);
    color: var(--effect-label);
  }

  .seg b {
    position: absolute;
    top: 12px;
    left: 14px;
    font-size: 19px;
    font-weight: 680;
    white-space: nowrap;
  }

  .past {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 83.5%;
    right: 0;
    background: repeating-linear-gradient(-45deg, transparent 0 6px, rgb(255 90 146 / 0.22) 6px 7px);
  }

  .vsync {
    position: absolute;
    top: -14px;
    bottom: -36px;
    left: 83.5%;
    width: 4px;
    margin-left: -2px;
    border-radius: 2px;
    background: var(--color-accent);
    box-shadow: 0 0 16px 2px rgb(255 90 146 / 0.45);
  }

  .scale {
    position: relative;
    height: 40px;
    color: var(--color-muted);
    font-family: var(--font-mono);
    font-size: 16px;
  }

  .scale span {
    position: absolute;
    top: 12px;
    transform: translateX(-50%);
  }

  .scale span:first-child {
    transform: none;
  }

  .scale .dl {
    left: 83.5%;
    transform: none;
    margin-left: 12px;
    color: var(--color-accent);
    font-weight: 700;
  }
</style>
</head>
<body>
  <img class="logo" src="../logo/lockup-dark.svg" alt="framebudget">
  <div class="npm"><span>$</span> npm i framebudget</div>
  <h1>Keep the effects.<br>Lose the stutter.</h1>
  <div class="chart">
    <div class="track">
      <div class="past"></div>
      <div class="seg" style="--c:var(--effect-app);left:0;width:calc(20% - 2px)"><b>Your app</b></div>
      <div class="seg" style="--c:var(--fb-violet);left:20%;width:calc(12% - 2px)"><b>Transition</b></div>
      <div class="seg" style="--c:var(--fb-amber);left:32%;width:calc(10.5% - 2px)"><b>Parallax</b></div>
      <div class="seg" style="--c:var(--fb-mint);left:42.5%;width:calc(16.5% - 2px)"><b>Canvas</b></div>
      <div class="seg" style="--c:var(--fb-cyan);left:59%;width:calc(5.5% - 2px)"></div>
      <div class="vsync"></div>
    </div>
    <div class="scale">
      <span style="left:0">0</span><span style="left:20%">4</span><span style="left:40%">8</span><span style="left:60%">12</span><span class="dl">16.7 ms</span>
    </div>
  </div>
</body>
</html>
